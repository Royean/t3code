name: Fork Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate fork release source
    if: github.repository == 'Royean/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.source.outputs.version }}
      tag: ${{ steps.source.outputs.tag }}
      publish: ${{ steps.source.outputs.publish }}
      prerelease: ${{ steps.source.outputs.prerelease }}
      sha: ${{ steps.source.outputs.sha }}
      publisher_sha: ${{ steps.trusted_refs.outputs.main_sha }}
    steps:
      # Resolve GitHub's real branch refs before loading any repository helper.
      - name: Capture trusted main and allowed branch commits
        id: trusted_refs
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const commits = {};
            for (const branch of ['main', 'feat/event-orchestration']) {
              const { data } = await github.rest.git.getRef({ ...context.repo, ref: `heads/${branch}` });
              if (data.object.type !== 'commit') throw new Error(`Invalid branch ref: ${branch}`);
              commits[branch] = data.object.sha;
            }
            core.setOutput('main_sha', commits.main);
            core.setOutput('commits', JSON.stringify(commits));
      - name: Download trusted policy at captured main commit
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          TRUSTED_SHA: ${{ steps.trusted_refs.outputs.main_sha }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            for (const file of ['.github/scripts/fork-release.cjs', 'apps/server/package.json']) {
              const { data } = await github.rest.repos.getContent({ ...context.repo,
                path: file, ref: process.env.TRUSTED_SHA,
              });
              if (Array.isArray(data) || data.type !== 'file' || data.encoding !== 'base64' || !data.content) {
                throw new Error(`Invalid trusted policy file: ${file}`);
              }
              const target = path.join('trusted-policy', file);
              fs.mkdirSync(path.dirname(target), { recursive: true });
              fs.writeFileSync(target, Buffer.from(data.content, 'base64'));
            }
      - name: Validate version and allowed branch ancestry
        id: source
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          TRUSTED_BRANCH_COMMITS: ${{ steps.trusted_refs.outputs.commits }}
        with:
          script: |
            const fs = require('node:fs');
            const { resolveRelease, resolveSourceCommit, assertAllowedCommit, findReleaseByTag } = require('./trusted-policy/.github/scripts/fork-release.cjs');
            const metadata = resolveRelease({
              repository: process.env.GITHUB_REPOSITORY, eventName: context.eventName,
              ref: context.ref, runId: context.runId, date: new Date(),
              baseVersion: JSON.parse(fs.readFileSync('trusted-policy/apps/server/package.json', 'utf8')).version,
            });
            const sha = await resolveSourceCommit({ github,
              repository: process.env.GITHUB_REPOSITORY, eventName: context.eventName,
              ref: context.ref, sha: context.sha,
            });
            const branch = await assertAllowedCommit({ github,
              repository: process.env.GITHUB_REPOSITORY, sha,
              branchCommits: JSON.parse(process.env.TRUSTED_BRANCH_COMMITS),
            });
            if (metadata.publish && await findReleaseByTag({ github,
              repository: process.env.GITHUB_REPOSITORY, tag: metadata.tag,
            })) throw new Error('This release or draft already exists. Use a fresh version.');
            for (const [key, value] of Object.entries({ ...metadata, sha })) core.setOutput(key, value);
            await core.summary.addRaw(`Source: ${sha}\n\nVersion: ${metadata.version}\n\nAllowed branch: ${branch}\n\nPublish: ${metadata.publish}\n`).write();

  checks:
    name: Full CI
    needs: prepare
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/ci.yml

  build:
    name: Package ${{ matrix.platform }} ${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac
            arch: arm64
            runner: macos-15
            target: dmg
            rust_target: aarch64-apple-darwin
            resource_key: darwin-arm64
          - platform: linux
            arch: x64
            runner: ubuntu-24.04
            target: AppImage
            rust_target: x86_64-unknown-linux-gnu
            resource_key: linux-x64
    env:
      APP_VERSION: ${{ needs.prepare.outputs.version }}
      T3CODE_TELEMETRY_CHANNEL: dev
      T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
      T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: "true"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      # Public fetch avoids checkout's auth cleanup, which traverses orphan
      # gitlinks in .repos even when the working tree excludes that directory.
      - name: Checkout public source without credentials
        env:
          CHECKOUT_REF: ${{ needs.prepare.outputs.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git -c credential.helper= fetch --no-tags --no-recurse-submodules --depth=1 origin "$CHECKOUT_REF"
          git sparse-checkout set --no-cone '/*' '!/.repos/' '!/apps/mobile/modules/t3-terminal/Vendor/**/*.a'
          git -c submodule.recurse=false checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$CHECKOUT_REF"
      - name: Install Linux packaging and launch libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config patchelf imagemagick xvfb libgtk-3-0t64 libnss3 libasound2t64 libgbm1
      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter @t3tools/desktop... --filter t3... --filter @t3tools/scripts...
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}
      - name: Align build versions
        run: node scripts/update-release-package-versions.ts "$APP_VERSION"
      - name: Build desktop and bundled web runtime
        run: vp run build:desktop
      - name: Build resource monitor
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
          RESOURCE_KEY: ${{ matrix.resource_key }}
        run: |
          cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target "$RUST_TARGET"
          mkdir -p "$RUNNER_TEMP/cli-resource-monitor/$RESOURCE_KEY"
          cp "native/resource-monitor/target/$RUST_TARGET/release/t3-resource-monitor" "$RUNNER_TEMP/cli-resource-monitor/$RESOURCE_KEY/"
      - name: Build standalone CLI archive
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          node apps/server/scripts/cli.ts build-exe --verbose
          node scripts/build-cli-archive.ts --platform "$BUILD_PLATFORM" --arch "$BUILD_ARCH" \
            --version "$APP_VERSION" --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" --output-dir release-cli
      - name: Execute the archived CLI
        run: node scripts/smoke-cli-archive.ts --archive release-cli/* --expect-version "$APP_VERSION"
      - name: Package unsigned desktop
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
          BUILD_ARCH: ${{ matrix.arch }}
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          node scripts/build-desktop-artifact.ts --platform "$BUILD_PLATFORM" --arch "$BUILD_ARCH" \
            --target "$BUILD_TARGET" --build-version "$APP_VERSION" --skip-build --verbose
      - name: Launch the packaged desktop with isolated fixture data
        run: |
          check=(node scripts/smoke-desktop-app.ts --artifacts-dir "$RUNNER_TEMP/desktop-launch-check")
          if [[ "$RUNNER_OS" == macOS ]]; then
            mount="$RUNNER_TEMP/desktop-launch-dmg"
            hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$(ls "$GITHUB_WORKSPACE"/release/*.dmg)"
            trap 'hdiutil detach "$mount" -force >/dev/null || true' EXIT
            app=$(ls -d "$mount"/*.app)
            executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
            "${check[@]}" --executable "$app/Contents/MacOS/$executable"
          else
            appimage=$(ls "$GITHUB_WORKSPACE"/release/*.AppImage)
            chmod +x "$appimage"
            (cd "$RUNNER_TEMP" && "$appimage" --appimage-extract >/dev/null)
            xvfb-run -a "${check[@]}" --executable "$RUNNER_TEMP/squashfs-root/t3code"
          fi
      - name: Collect distribution files
        run: |
          mkdir release-publish
          cp release-cli/* release-publish/
          shopt -s nullglob
          for file in release/*.dmg release/*.zip release/*.AppImage release/*.deb release/*.blockmap release/*.yml; do
            [[ "$file" == */builder-debug.yml ]] && continue
            cp "$file" release-publish/
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fork-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-publish/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload launch failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fork-launch-failure-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/desktop-launch-check
          if-no-files-found: ignore

  windows:
    name: Package Windows x64
    needs: [prepare, build]
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      APP_VERSION: ${{ needs.prepare.outputs.version }}
      T3CODE_TELEMETRY_CHANNEL: dev
      T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
      T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: "true"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      # Public fetch avoids checkout's auth cleanup, which traverses orphan
      # gitlinks in .repos even when the working tree excludes that directory.
      - name: Checkout public source without credentials
        env:
          CHECKOUT_REF: ${{ needs.prepare.outputs.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git -c credential.helper= fetch --no-tags --no-recurse-submodules --depth=1 origin "$CHECKOUT_REF"
          git sparse-checkout set --no-cone '/*' '!/.repos/' '!/apps/mobile/modules/t3-terminal/Vendor/**/*.a'
          git -c submodule.recurse=false checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$CHECKOUT_REF"
      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter @t3tools/desktop... --filter t3... --filter @t3tools/scripts...
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fork-linux-x64
          path: wsl-runtime
      - name: Build desktop and native CLI
        run: |
          node scripts/update-release-package-versions.ts "$APP_VERSION"
          vp run build:desktop
          cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target x86_64-pc-windows-msvc
          mkdir -p "$RUNNER_TEMP/cli-resource-monitor/win32-x64"
          cp native/resource-monitor/target/x86_64-pc-windows-msvc/release/t3-resource-monitor.exe "$RUNNER_TEMP/cli-resource-monitor/win32-x64/"
          node apps/server/scripts/cli.ts build-exe --verbose
          node scripts/build-cli-archive.ts --platform win --arch x64 --version "$APP_VERSION" \
            --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" --output-dir release-cli
          node scripts/smoke-cli-archive.ts --archive release-cli/* --expect-version "$APP_VERSION"
      - name: Package unsigned Windows installer with WSL runtime
        run: |
          node scripts/build-desktop-artifact.ts --platform win --arch x64 --target nsis \
            --build-version "$APP_VERSION" --skip-build --keep-stage --verbose \
            --wsl-runtime "$GITHUB_WORKSPACE/wsl-runtime/t3-$APP_VERSION-linux-x64.tar.gz"
      - name: Launch packaged Windows desktop
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          import { spawnSync } from 'node:child_process';
          import { resolveDesktopProductName } from './scripts/build-desktop-artifact.ts';
          const stages = fs.readdirSync(os.tmpdir()).filter((name) => name.startsWith('t3code-desktop-win-stage-'));
          if (stages.length !== 1) throw new Error('Expected one Windows package staging directory.');
          const appDir = path.join(os.tmpdir(), stages[0], 'app/dist/win-unpacked');
          const executable = path.join(appDir, `${resolveDesktopProductName(process.env.APP_VERSION)}.exe`);
          const child = spawnSync(process.execPath, ['scripts/smoke-desktop-app.ts', '--executable', executable,
            '--artifacts-dir', path.join(process.env.RUNNER_TEMP, 'desktop-launch-check')], { stdio: 'inherit' });
          if (child.error) throw child.error;
          process.exitCode = child.status ?? 1;
          NODE
      - name: Collect Windows distribution files
        run: |
          mkdir release-publish
          cp release-cli/* release-publish/
          shopt -s nullglob
          for file in release/*.exe release/*.blockmap release/*.yml; do
            [[ "$file" == */builder-debug.yml ]] && continue
            cp "$file" release-publish/
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fork-win-x64
          path: release-publish/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload Windows launch failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fork-launch-failure-win-x64
          path: ${{ runner.temp }}/desktop-launch-check
          if-no-files-found: ignore

  android:
    name: Build standalone Android arm64 APK
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CI: "1"
      APP_VARIANT: production
      T3CODE_MOBILE_UPDATES_ENABLED: "0"
      NODE_OPTIONS: --max-old-space-size=6144
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      # Public fetch avoids checkout's auth cleanup, which traverses orphan
      # gitlinks in .repos even when the working tree excludes that directory.
      - name: Checkout public source without credentials
        env:
          CHECKOUT_REF: ${{ needs.prepare.outputs.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git -c credential.helper= fetch --no-tags --no-recurse-submodules --depth=1 origin "$CHECKOUT_REF"
          git sparse-checkout set --no-cone '/*' '!/.repos/' '!/apps/mobile/modules/t3-terminal/Vendor/**/*.a'
          git -c submodule.recurse=false checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$CHECKOUT_REF"
      - name: Reclaim runner SDK space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost
      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter @t3tools/mobile...
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Configure fork identity and public account identifiers
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { parseEnv } = require('node:util');
          const { patchExpoConfig } = require('./.github/scripts/fork-android.cjs');
          const publicConfig = parseEnv(fs.readFileSync('.env.example', 'utf8'));
          const names = ['T3CODE_CLERK_PUBLISHABLE_KEY', 'T3CODE_CLERK_JWT_TEMPLATE',
            'T3CODE_CLERK_CLI_OAUTH_CLIENT_ID', 'T3CODE_RELAY_URL'];
          fs.writeFileSync('.env', names.filter((name) => publicConfig[name])
            .map((name) => `${name}=${publicConfig[name]}\n`).join(''));
          const file = 'apps/mobile/app.config.ts';
          fs.writeFileSync(file, patchExpoConfig(fs.readFileSync(file, 'utf8'), {
            version: process.env.VERSION, versionCode: Number(process.env.GITHUB_RUN_NUMBER),
          }));
          NODE
      - name: Generate production native project
        working-directory: apps/mobile
        run: vp exec expo prebuild --clean --platform android --no-install
      - name: Disable generated debug signing for release
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { disableDebugSigning } = require('./.github/scripts/fork-android.cjs');
          const file = 'apps/mobile/android/app/build.gradle';
          fs.writeFileSync(file, disableDebugSigning(fs.readFileSync(file, 'utf8')));
          NODE
      - name: Build release APK with embedded JavaScript
        working-directory: apps/mobile/android
        run: |
          ./gradlew :app:assembleRelease --no-daemon --max-workers=2 \
            -PreactNativeArchitectures=arm64-v8a -Dorg.gradle.jvmargs='-Xmx4096m -XX:MaxMetaspaceSize=1024m'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fork-android-unsigned
          path: apps/mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  android_sign:
    name: Sign and verify standalone Android APK
    needs: [prepare, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # The keystore never shares a job with candidate Gradle or JavaScript.
      - name: Download trusted Android verification helper
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          TRUSTED_SHA: ${{ needs.prepare.outputs.publisher_sha }}
        with:
          script: |
            const fs = require('node:fs');
            const file = '.github/scripts/fork-android.cjs';
            const { data } = await github.rest.repos.getContent({ ...context.repo,
              path: file, ref: process.env.TRUSTED_SHA,
            });
            if (Array.isArray(data) || data.type !== 'file' || data.encoding !== 'base64' || !data.content) {
              throw new Error(`Invalid trusted helper: ${file}`);
            }
            fs.mkdirSync('.github/scripts', { recursive: true });
            fs.writeFileSync(file, Buffer.from(data.content, 'base64'));
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fork-android-unsigned
          path: unsigned
      - name: Sign with persistent fork key and validate the APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.FORK_ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.FORK_ANDROID_KEYSTORE_PASSWORD }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" && test -n "$ANDROID_KEYSTORE_PASSWORD"
          key="$RUNNER_TEMP/fork-android.p12"
          trap 'rm -f "$key" "$RUNNER_TEMP/fork-android-cert.der"' EXIT
          (umask 077 && printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$key")
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          test -x "$tools/apksigner" && test -x "$tools/aapt2"
          mkdir release-publish
          apk="release-publish/t3-$VERSION-android-arm64.apk"
          "$tools/zipalign" -P 16 -f 4 unsigned/app-release-unsigned.apk "$RUNNER_TEMP/android-aligned.apk"
          "$tools/apksigner" sign --ks "$key" --ks-key-alias t3code-fork \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEYSTORE_PASSWORD \
            --out "$apk" "$RUNNER_TEMP/android-aligned.apk"
          "$tools/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/android-signature.txt"
          keytool -exportcert -keystore "$key" -storepass:env ANDROID_KEYSTORE_PASSWORD \
            -alias t3code-fork -file "$RUNNER_TEMP/fork-android-cert.der"
          expected=$(sha256sum "$RUNNER_TEMP/fork-android-cert.der" | cut -d' ' -f1)
          grep -F "Signer #1 certificate SHA-256 digest: $expected" "$RUNNER_TEMP/android-signature.txt"
          "$tools/aapt2" dump badging "$apk" > "$RUNNER_TEMP/android-badging.txt"
          python3 - "$apk" > "$RUNNER_TEMP/android-entries.json" <<'PY'
          import json, sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as apk:
              print(json.dumps([{"name": item.filename, "size": item.file_size} for item in apk.infolist()]))
          PY
          node <<'NODE'
          const fs = require('node:fs');
          const { verifyApkMetadata } = require('./.github/scripts/fork-android.cjs');
          const metadata = verifyApkMetadata({
            badging: fs.readFileSync(`${process.env.RUNNER_TEMP}/android-badging.txt`, 'utf8'),
            entries: JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/android-entries.json`, 'utf8')),
            version: process.env.VERSION,
          });
          const signature = fs.readFileSync(`${process.env.RUNNER_TEMP}/android-signature.txt`, 'utf8');
          metadata.certificateSha256 = /Signer #1 certificate SHA-256 digest: ([0-9a-f]+)/.exec(signature)[1];
          fs.writeFileSync('release-publish/ANDROID-SIGNING.json', JSON.stringify(metadata, null, 2) + '\n');
          NODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fork-android-arm64
          path: release-publish/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Verify checksums and publish
    needs: [prepare, checks, build, windows, android_sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      linux_sha256: ${{ steps.distribution.outputs.linux_sha256 }}
    permissions:
      contents: write
    steps:
      # The write token never executes packaging or publishing code from the
      # candidate branch. Only the main revision captured in prepare is trusted.
      - name: Download trusted release publisher
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          TRUSTED_SHA: ${{ needs.prepare.outputs.publisher_sha }}
        with:
          script: |
            const fs = require('node:fs');
            const file = '.github/scripts/fork-release.cjs';
            const { data } = await github.rest.repos.getContent({ ...context.repo,
              path: file, ref: process.env.TRUSTED_SHA,
            });
            if (Array.isArray(data) || data.type !== 'file' || data.encoding !== 'base64' || !data.content) {
              throw new Error(`Invalid trusted helper: ${file}`);
            }
            fs.mkdirSync('.github/scripts', { recursive: true });
            fs.writeFileSync(file, Buffer.from(data.content, 'base64'));
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fork-*-*
          path: artifacts
      - name: Combine unique assets and record provenance
        id: distribution
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          fs.mkdirSync('release-publish');
          for (const artifact of ['fork-mac-arm64', 'fork-linux-x64', 'fork-win-x64', 'fork-android-arm64']) {
            for (const name of fs.readdirSync(`artifacts/${artifact}`)) {
              fs.copyFileSync(`artifacts/${artifact}/${name}`, `release-publish/${name}`, fs.constants.COPYFILE_EXCL);
            }
          }
          fs.writeFileSync('release-publish/BUILD-INFO.json', JSON.stringify({
            repository: process.env.GITHUB_REPOSITORY,
            commit: process.env.SOURCE_SHA,
            version: process.env.VERSION,
            run: `https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            builtAt: new Date().toISOString(),
            platforms: ['darwin-arm64', 'linux-x64', 'win32-x64', 'android-arm64'],
            signing: 'Desktop and Windows CLI unsigned; macOS CLI ad hoc; Android signed with persistent fork key (see ANDROID-SIGNING.json).',
          }, null, 2) + '\n');
          require('./.github/scripts/fork-release.cjs').writeChecksums('release-publish', process.env.VERSION);
          const archive = `t3-${process.env.VERSION}-linux-x64.tar.gz`;
          const checksum = require('node:crypto').createHash('sha256')
            .update(fs.readFileSync(`release-publish/${archive}`)).digest('hex');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `linux_sha256=${checksum}\n`);
          NODE
          (cd release-publish && sha256sum -c SHA256SUMS)
      - name: Upload complete build-only distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fork-distribution-${{ needs.prepare.outputs.version }}
          path: release-publish/*
          compression-level: 0
          retention-days: 14
      - name: Publish only after complete verification
        if: needs.prepare.outputs.publish == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        with:
          script: |
            const { publishRelease } = require('./.github/scripts/fork-release.cjs');
            const body = [
              `Fork build of ${process.env.SOURCE_SHA}.`,
              '',
              'macOS Apple Silicon: DMG/ZIP desktop and standalone CLI. Linux x64: AppImage/DEB desktop and standalone CLI. Windows x64: NSIS desktop and standalone CLI ZIP. Android arm64: standalone release APK.',
              'CLI archives include the web client and need no Node installation. Verify downloads against SHA256SUMS.',
              '',
              'Unsigned desktop fork: macOS is not Developer ID signed or notarized, so Gatekeeper may require explicit approval; macOS CLI is signed ad hoc. Windows packages have no Authenticode signature and may trigger SmartScreen. Install and update manually; CLI release discovery still uses upstream.',
              'Android uses its own package com.royean.t3code and persistent signing key, embeds JavaScript and has upstream EAS OTA disabled. It connects using the existing public T3 account configuration; Google native sign-in and push notifications need separate provider registration and device validation.',
              'Desktop update configuration points to this fork. No npm publication or upstream service deployment occurs.',
              'Intel macOS, Linux arm64 and mobile store publication are not included.',
              '',
              `[Build and full CI](https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})`,
            ].join('\n');
            const url = await publishRelease({ github,
              repository: process.env.GITHUB_REPOSITORY, tag: process.env.RELEASE_TAG,
              sha: process.env.SOURCE_SHA, prerelease: process.env.PRERELEASE === 'true',
              directory: 'release-publish', body,
            });
            await core.summary.addLink('Published fork release', url).write();

  deploy:
    name: Deploy verified T3 runtime to Tencent server
    needs: [prepare, checks, release]
    if: github.repository == 'Royean/t3code' && github.event_name == 'push' && needs.prepare.outputs.publish == 'true' && needs.release.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # No repository checkout: only this run's checked and published archive is
      # passed to the server's separately installed, restricted deployment helper.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fork-linux-x64
          path: deploy-artifact
      - name: Verify archive and send through restricted SSH command
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
          EXPECTED_SHA256: ${{ needs.release.outputs.linux_sha256 }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ && "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ && "$DEPLOY_USER" != root ]]
          test -n "$DEPLOY_SSH_KEY" && test -n "$DEPLOY_KNOWN_HOSTS"
          archive="deploy-artifact/t3-$VERSION-linux-x64.tar.gz"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$archive" | sha256sum -c -
          key="$RUNNER_TEMP/t3-deploy-key"
          known_hosts="$RUNNER_TEMP/t3-deploy-known-hosts"
          trap 'rm -f "$key" "$known_hosts"' EXIT
          (umask 077 && printf '%s\n' "$DEPLOY_SSH_KEY" > "$key" && printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$known_hosts")
          chmod 600 "$key" "$known_hosts"
          ssh -T -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known_hosts" \
            -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
            -- "$DEPLOY_USER@$DEPLOY_HOST" "t3code $RELEASE_TAG $SOURCE_SHA $EXPECTED_SHA256" < "$archive"
