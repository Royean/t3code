name: Build t4code macOS 0.1.13

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    if: github.ref == 'refs/heads/build/macos-0.1.13-20261125'
    runs-on: macos-15
    timeout-minutes: 90
    env:
      BASE_SHA: 149efea67ab34b9d26ddaa790a1c4ac5b29545f6
      APP_VERSION: '0.1.13'
      T3CODE_TELEMETRY_CHANNEL: dev
      T3CODE_DESKTOP_UPDATE_REPOSITORY: Royean/t4code
      T3CODE_DESKTOP_MAC_PRO: 'true'
      T3CODE_SELF_HOSTED_ONLY: '1'
      T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: 'true'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out t4code source
        env:
          CHECKOUT_SHA: ${{ github.sha }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          test "$(uname -m)" = arm64
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git -c credential.helper= fetch --no-tags --no-recurse-submodules --depth=12 origin "$CHECKOUT_SHA"
          git sparse-checkout set --no-cone '/*' '!/.repos/' '!/apps/mobile/modules/t3-terminal/Vendor/**/*.a'
          git -c submodule.recurse=false checkout --detach FETCH_HEAD
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          test "$(git diff --name-only "$BASE_SHA" HEAD)" = '.github/workflows/mobile-eas-preview-build.yml'
      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter @t3tools/desktop... --filter t3... --filter @t3tools/scripts...
          save-pnpm-store: 'false'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          targets: aarch64-apple-darwin
      - name: Align build versions
        run: |
          mkdir -p node_modules/@t3tools
          test -e node_modules/@t3tools/shared || ln -s ../../packages/shared node_modules/@t3tools/shared
          node scripts/update-release-package-versions.ts "$APP_VERSION"
      - name: Build desktop and bundled web runtime
        run: vp run build:desktop
      - name: Build resource monitor
        run: cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target aarch64-apple-darwin
      - name: Create Apple Silicon DMG
        run: |
          node scripts/build-desktop-artifact.ts --platform mac --arch arm64 --target dmg \
            --build-version "$APP_VERSION" --skip-build --verbose
      - name: Verify and launch the packaged app
        run: |
          set -- release/*.dmg
          test "$#" -eq 1 && test -f "$1"
          dmg="$1"
          mount="$RUNNER_TEMP/t4code-desktop-dmg"
          hdiutil verify "$dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg"
          trap 'hdiutil detach "$mount" >/dev/null || true' EXIT
          if ! codesign --verify --deep --strict "$mount/t4code.app"; then
            staged="$(mktemp -d "$RUNNER_TEMP/t4code-reseal.XXXXXX")"
            ditto "$mount" "$staged"
            hdiutil detach "$mount"
            xattr -cr "$staged/t4code.app"
            codesign --force --deep --sign - --timestamp=none "$staged/t4code.app"
            dmg="$RUNNER_TEMP/t4code-ad-hoc.dmg"
            hdiutil create -volname "t4code $APP_VERSION Installer" -srcfolder "$staged" -format UDZO "$dmg"
            hdiutil verify "$dmg"
            hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg"
          fi
          app="$mount/t4code.app"
          info="$app/Contents/Info.plist"
          test -f "$info"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$info")" = 'com.royean.t3code.pro'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$info")" = "$APP_VERSION"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$info")
          icon=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$info")
          test -s "$app/Contents/Resources/$icon" || test -s "$app/Contents/Resources/$icon.icns"
          test "$(lipo -archs "$app/Contents/MacOS/$executable")" = arm64
          codesign --verify --deep --strict "$app"
          node scripts/smoke-desktop-app.ts --executable "$app/Contents/MacOS/$executable" \
            --artifacts-dir "$RUNNER_TEMP/desktop-launch-check"
          mkdir mac-output
          cp "$dmg" mac-output/t4code-0.1.13-mac-arm64.dmg
          printf '%s\n' "$BASE_SHA" > mac-output/source-sha.txt
          (cd mac-output && shasum -a 256 t4code-0.1.13-mac-arm64.dmg source-sha.txt > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: t4code-0.1.13-mac-arm64
          path: mac-output/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: t4code-0.1.13-mac-launch-failure
          path: ${{ runner.temp }}/desktop-launch-check/
          if-no-files-found: ignore
          retention-days: 3
